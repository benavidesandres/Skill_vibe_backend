services:
  postgres:
    image: postgres:16-alpine
    container_name: skillvibes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-skillvibes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillvibes}
      POSTGRES_DB: ${DB_NAME:-skillvibes_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
